[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cambrian-agent-sdk"
version = "0.1.0"
description = "Cambrian Agent SDK — build Cambrian agents in Python with zero boilerplate"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.60.0",
    "grpcio-health-checking>=1.60.0",
    "protobuf>=4.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "grpcio-tools>=1.60.0",
]

[tool.hatch.build.targets.wheel]
packages = ["cambrian_agent_sdk"]
