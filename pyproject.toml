[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cambrian-agent-sdk"
version = "0.1.0"
description = "Cambrian Agent SDK — build Cambrian agents in Python with zero boilerplate"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Cambrian" }]
keywords = ["cambrian", "agent", "ai", "orchestration", "grpc", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    # The vendored _proto gencode is stamped protobuf 6.31.1 and validates the runtime at
    # import (ValidateProtobufRuntimeVersion), so the runtime must be same-major and >= that.
    "protobuf>=6.31.1,<7",
    "grpcio>=1.66.0",
    "grpcio-health-checking>=1.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "grpcio-tools>=1.66.0",
]

[project.urls]
Homepage = "https://github.com/cambrian-sh/agent-sdk-python"
Repository = "https://github.com/cambrian-sh/agent-sdk-python"
Issues = "https://github.com/cambrian-sh/agent-sdk-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["cambrian_agent_sdk"]
# Ship the type marker + vendored gRPC/proto gencode; keep test/cache noise out of the wheel.
artifacts = ["cambrian_agent_sdk/py.typed"]
exclude = ["**/__pycache__", "**/*.pyc", "tests", "**/*_test.py", "**/test_*.py"]

[tool.hatch.build.targets.sdist]
include = ["cambrian_agent_sdk", "README.md", "LICENSE", "pyproject.toml"]
exclude = ["**/__pycache__", "**/*.pyc"]
