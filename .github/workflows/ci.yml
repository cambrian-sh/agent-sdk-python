# CI gates for cambrian-agent-sdk (ENG-1608): ruff, mypy and pytest on every pull request
# and every push to main. publish.yml only builds on a `v*` tag; until this workflow nothing
# ran the three gates pyproject.toml configures (ENG-1450).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    name: ruff, mypy, pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The floor pyproject declares (requires-python >=3.10, ruff/mypy target 3.10) and the
        # newest supported minor. 3.13 is pinned to a patch release on purpose: CPython 3.13.1
        # skips the recursion limit for defaulted-argument calls (AGENTS.md §4.7, ENG-1604), so
        # a floating "3.13" must never be allowed to resolve to it.
        python: ["3.10", "3.13.14"]
    steps:
      # The SDK goes to sdk/ and core to cambrian-core/ beside it: the same layout as the
      # workspace, which tests/test_proto_stub_parity.py reads (../cambrian-core/api/proto).
      - name: Checkout the SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sdk

      # Core is the source of truth for cambrian.proto; the parity test compiles it and
      # compares it with the vendored _proto stub. Same token rule as core's and ui's
      # proto-sync jobs: if the repository is private, SIBLING_CHECKOUT_TOKEN must grant
      # read access, and the job fails loudly rather than skipping the gate.
      - name: Checkout cambrian-core (source of truth for cambrian.proto)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cambrian-sh/core
          path: cambrian-core
          token: ${{ secrets.SIBLING_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      # The dev extra carries pytest, grpcio-tools (needed by the proto parity test), ruff,
      # mypy and the type stubs.
      - name: Install
        working-directory: sdk
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        working-directory: sdk
        run: ruff check

      # Each gate runs even when an earlier one failed, so a lint finding never hides a type
      # error or a failing test; the job still fails if any step does.
      - name: Mypy
        if: ${{ !cancelled() }}
        working-directory: sdk
        run: mypy

      # tests/conftest.py caps the process's memory itself (RLIMIT_DATA here, ENG-1606), so a
      # runaway test fails with MemoryError under its own name. CAMBRIAN_SDK_REQUIRE_CORE_PROTO
      # turns the parity test's "core not checked out" / "grpc_tools missing" skip into a
      # failure: in CI that gate must run, never pass by skipping.
      - name: Pytest
        if: ${{ !cancelled() }}
        working-directory: sdk
        env:
          CAMBRIAN_SDK_REQUIRE_CORE_PROTO: "1"
        run: pytest -q -rs
